# PhishSim configuration — copy to config.yaml and edit.

# Base URL of the tracking server, as employees will reach it.
# Use an INTERNAL address on your own domain.
base_url: "http://training.example-corp.local:5000"

# Admin dashboard key — anyone with this key can view results. Keep it secret.
admin_key: "change-me-to-a-long-random-string"

# You must explicitly confirm you are authorized to run this simulation
# against your own employees. send_campaign.py refuses to --send otherwise.
authorized: false

# SMTP settings for sending the lure email. Use your organization's own server.
smtp:
  host: "smtp.example-corp.local"
  port: 587
  use_tls: true
  username: "security-awareness@example-corp.local"
  password: ""            # prefer setting SMTP_PASSWORD env var instead
  from_name: "IT & Facilities"
  from_email: "facilities@example-corp.local"
