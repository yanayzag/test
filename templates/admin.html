<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhishSim — לוח בקרה</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; direction: rtl;
           background: #f0f4f8; color: #1b2733; margin: 0; padding: 24px; }
    h1 { color: #1a5276; }
    table { border-collapse: collapse; width: 100%; max-width: 760px; background: #fff;
            border-radius: 10px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    th, td { padding: 12px 16px; text-align: right; border-bottom: 1px solid #eef2f5; }
    th { background: #1a5276; color: #fff; font-weight: 600; }
    .bar { background: #eef2f5; border-radius: 6px; height: 18px; width: 160px; display: inline-block; vertical-align: middle; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: #e67e22; }
    .empty { color: #889; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>תוצאות תרגילי מודעות</h1>
  {% if campaigns %}
  <table>
    <tr><th>קמפיין</th><th>נשלחו</th><th>לחצו</th><th>אחוז לחיצה</th></tr>
    {% for c in campaigns %}
    <tr>
      <td>{{ c.name }}</td>
      <td>{{ c.sent }}</td>
      <td>{{ c.clicked }}</td>
      <td>
        <span class="bar"><span style="width: {{ c.pct }}%"></span></span>
        {{ c.pct }}%
      </td>
    </tr>
    {% endfor %}
  </table>
  {% else %}
  <p class="empty">עדיין אין קמפיינים שנשלחו.</p>
  {% endif %}
</body>
</html>
